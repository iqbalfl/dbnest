# CI sesuai DESIGN.md §18: build + unit test di Ubuntu 22.04 dan 24.04,
# fmt/clippy wajib lulus, frontend di-typecheck, plus smoke test CLI di
# container Fedora.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dipakai untuk menjalankan job integrasi secara manual (lihat di bawah).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          # Tauri v2 selalu butuh webkit2gtk-4.1 (yang 4.0 hanya untuk v1).
          # Paketnya tersedia di 22.04 maupun 24.04.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Kunci cache bawaan hanya memuat nama job ("rust") dan "Linux-x64",
          # jadi kedua leg matrix memakai entri yang sama dan saling menimpa
          # target dir. `key` memisahkan cache per versi Ubuntu.
          key: ${{ matrix.os }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Unit tests
        run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Typecheck and build
        working-directory: ui
        run: npm run build

  cli-smoke-fedora:
    name: CLI smoke test (Fedora)
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: dnf install -y cargo rust gcc

      # Hanya CLI: crate GUI butuh webkit2gtk yang tidak perlu diuji di sini.
      - name: Build CLI
        run: cargo build -p dbnest-cli

      - name: Smoke test
        run: |
          export XDG_DATA_HOME="$PWD/.smoke/data"
          export XDG_CONFIG_HOME="$PWD/.smoke/config"
          export XDG_CACHE_HOME="$PWD/.smoke/cache"
          export XDG_STATE_HOME="$PWD/.smoke/state"
          ./target/debug/dbnest --help
          ./target/debug/dbnest engines
          ./target/debug/dbnest list
          ./target/debug/dbnest versions
          ./target/debug/dbnest doctor

  # Tes integrasi mengunduh binary engine sungguhan, jadi hanya jalan kalau
  # manifest sudah berisi artefak terverifikasi (lihat README). Sampai saat
  # itu job ini dijalankan manual lewat workflow_dispatch.
  integration:
    name: Integration (${{ matrix.label }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        # Target utama dulu: Debian dan turunannya. Tiap leg memasang engine
        # sungguhan dari manifest lalu menjalankannya, jadi ini yang benar-benar
        # membuktikan binary hasil build-engines.yml jalan di sana.
        include:
          - label: ubuntu-24.04 (runner)
            container: ""
          - label: ubuntu 22.04
            container: ubuntu:22.04
          - label: debian 12
            container: debian:12
          - label: debian 11
            container: debian:11
    steps:
      - name: Install system dependencies
        run: |
          set -eux
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO=sudo
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config xz-utils procps
          # MySQL/MariaDB butuh libaio dan libncurses dari sistem (DESIGN §8).
          # Namanya berbeda antar rilis (libaio1 vs libaio1t64 di Ubuntu 24.04),
          # jadi dicoba satu per satu.
          for pkg in libaio1 libaio1t64 libncurses6 libncurses5 libtinfo6 libnuma1; do
            $SUDO apt-get install -y --no-install-recommends "$pkg" || true
          done

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Engine lifecycle (all four engines)
        env:
          DBNEST_IT: "1"
        run: cargo test -p dbnest-core -- --ignored --test-threads=1
